<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro de Portaria</title>
  <style>
    .portaria-container{
      max-width:900px;
      margin:40px auto;
      background:#fff;
      border-radius:18px;
      padding:32px;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
      font-family:Inter,Arial,sans-serif;
    }

    .portaria-header{ margin-bottom:28px; }
    .portaria-header h1{ margin:0; font-size:28px; color:#0f172a; }
    .portaria-header p{ margin-top:6px; color:#64748b; }

    .portaria-form{ display:flex; flex-direction:column; gap:20px; }

    .form-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
    .form-group{ display:flex; flex-direction:column; gap:8px; }

    .form-group label{ font-weight:700; color:#334155; }

    .form-group input,
    .form-group select,
    .form-group textarea{
      border:1px solid #cbd5e1;
      border-radius:12px;
      padding:12px 14px;
      font-size:14px;
      outline:none;
      transition:.2s;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus{
      border-color:#2563eb;
      box-shadow:0 0 0 4px rgba(37,99,235,.1);
    }

    .form-actions{ display:flex; gap:12px; margin-top:10px; }

    .btn-primary,
    .btn-secondary{
      border:none;
      border-radius:12px;
      padding:12px 22px;
      font-weight:700;
      cursor:pointer;
    }

    .btn-primary{ background:#2563eb; color:#fff; }
    .btn-secondary{ background:#e2e8f0; color:#0f172a; }

    .destaque-dt {
      background: #eff6ff;
      border: 2px solid #93c5fd;
      padding: 16px;
      border-radius: 12px;
    }

    @media(max-width:768px){
      .form-grid{ grid-template-columns:1fr; }
      .portaria-container{ padding:20px; }
    }
  </style>
</head>
<body style="background:#f8fafc; margin:0; padding:20px;">
  <div class="portaria-container">
    <div class="portaria-header">
      <h1>Registro de Portaria</h1>
      <p>Controle de entrada e saída de veículos</p>
    </div>

    <form class="portaria-form">
      <div class="form-group destaque-dt">
        <label>DT (conforme PDF)</label>
        <input type="text" name="dt" value="23258415" />
      </div>

      <div class="form-group">
        <label>Número da autorização</label>
        <input type="text" name="numero" value="052025" />
      </div>

      <div class="form-group">
        <label>Transportadora</label>
        <input type="text" name="transportadora" value="JOALERIA TRANSPORTES" placeholder="Digite conforme documento" />
      </div>

      <div class="form-group">
        <label>Nome do Motorista</label>
        <input type="text" name="motorista" value="VAGNER RODRIGUES DOS SANTOS" />
      </div>

      <div class="form-group">
        <label>CPF</label>
        <input type="text" name="cpf" value="301863388/13" />
      </div>

      <div class="form-group">
        <label>Contato</label>
        <input type="text" name="contato" value="(11)91055-6767" />
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>Placa</label>
          <input type="text" name="placa1" value="EZU-4743" />
        </div>

        <div class="form-group">
          <label>Placa 2 (Carreta)</label>
          <input type="text" name="placa2" value="EOE-9685" />
        </div>

        <div class="form-group">
          <label>Placa 3 (Bitrem)</label>
          <input type="text" name="placa3" value="" />
        </div>
      </div>

      <div class="form-group">
        <label>Tipo de Veículo</label>
        <select name="tipo_veiculo">
          <option value="">Selecione...</option>
          <option>TRUCK BAU</option>
          <option>TRUCK BAU 76 m³</option>
          <option>TRUCK SIDER</option>
          <option>CARRETA</option>
          <option selected>CARRETA BAU</option>
          <option>BITREM</option>
        </select>
      </div>

      <div class="form-group">
        <label>Condômino / Cliente</label>
        <input type="text" name="cliente" value="SUZANO PAPEL E CELULOSE" />
      </div>

      <div class="form-group">
        <label>Operação</label>
        <input type="text" name="operacao" value="CARGA" />
      </div>

      <div class="form-group">
        <label>Data Entrada / Início</label>
        <input type="text" name="data_entrada" value="19/05/2026 19:58:00" />
      </div>

      <div class="form-group">
        <label>Responsável (Porteiro)</label>
        <input type="text" name="porteiro" value="MARCOS" />
      </div>

      <div class="form-group">
        <label>Documento (RG)</label>
        <input type="text" name="rg" value="41.823.143-X" />
      </div>

      <div class="form-group">
        <label>Observações</label>
        <textarea name="observacoes" rows="4">Autorização de entrada/serviço preenchida com dados do PDF.</textarea>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-primary">Registrar Entrada</button>
        <button type="reset" class="btn-secondary">Limpar</button>
      </div>
    </form>
  </div>
</body>
</html>
